    <!-- TÍTULO -->
    <h1 style="text-align: center; margin-top: 110px; margin-bottom: 35px;">
        ❤️ Notícias Favoritas
    </h1>


    <!-- NOTÍCIAS FAVORITAS -->
    <div class="container" id="listaFavoritos">

        <!-- O JavaScript vai colocar as notícias aqui -->

    </div>


    <!-- MENSAGEM CASO NÃO TENHA FAVORITOS -->
    <div id="semFavoritos"
        style="
            display: none;
            text-align: center;
            margin: 70px 20px;
            min-height: 250px;
        ">

        <i class="fa-regular fa-heart"
            style="
                font-size: 55px;
                color: #C71F37;
                margin-bottom: 20px;
            ">
        </i>

        <h2>Você ainda não possui notícias favoritas.</h2>

        <p>
            Clique no ❤️ de uma notícia para adicioná-la aqui.
        </p>

    </div>


    <!-- FOOTER -->
    <footer>
        <p>© 2025 BemEstar+ | Todos os direitos reservados</p>
    </footer>

    <div id="toast"></div>


    <!-- SEU SCRIPT NORMAL -->

    <!-- SCRIPT DA PÁGINA DE FAVORITOS -->
    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const lista = document.getElementById("listaFavoritos");
            const semFavoritos = document.getElementById("semFavoritos");

            // Busca os favoritos salvos
            let favoritos = JSON.parse(
                localStorage.getItem("favoritos")
            ) || [];


            // ==============================
            // NÃO TEM FAVORITOS
            // ==============================

            if (favoritos.length === 0) {

                semFavoritos.style.display = "block";

                return;
            }


            // ==============================
            // MOSTRAR FAVORITOS
            // ==============================

            favoritos.forEach((noticia, index) => {

                const card = document.createElement("div");

                card.classList.add("noticia");


                card.innerHTML = `

                    <button
                        class="favorito ativo"
                        data-index="${index}"
                        title="Remover dos favoritos">

                        <i class="fa-solid fa-heart"></i>

                    </button>


                    <img
                        src="${noticia.imagem}"
                        alt="${noticia.titulo}"
                    >


                    <div class="conteudo">

                        <h2>
                            ${noticia.titulo}
                        </h2>


                        ${
                            noticia.data
                            ?
                            `<p class="data">
                                ${noticia.data}
                            </p>`
                            :
                            ""
                        }


                        <a href="${noticia.link}">

                            <button>
                                Saiba Mais
                            </button>

                        </a>

                    </div>

                `;


                lista.appendChild(card);

            });


            // ==============================
            // REMOVER FAVORITO
            // ==============================

            document.querySelectorAll(
                "#listaFavoritos .favorito"
            ).forEach(botao => {

                botao.addEventListener("click", () => {

                    const index =
                        Number(botao.dataset.index);


                    favoritos.splice(index, 1);


                    localStorage.setItem(
                        "favoritos",
                        JSON.stringify(favoritos)
                    );


                    // Recarrega para atualizar a página
                    location.reload();

                });

            });

        });

    </script>
